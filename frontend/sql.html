<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    background: #1c1c1e; color: #f5f5f5; font-size: 14px; line-height: 1.4;
    padding: 16px; min-height: 100vh;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header a { color: #0a84ff; text-decoration: none; font-size: 13px; }
  .editor-row {
    display: flex; gap: 8px; align-items: stretch;
  }
  .sidebar {
    width: 160px; flex-shrink: 0;
    background: #2c2c2e; border: 1px solid #444; border-radius: 8px;
    padding: 8px; overflow-y: auto;
  }
  .sidebar-title {
    font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #444;
  }
  .table-item {
    padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: 4px;
    color: #0a84ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .table-item:hover { background: #3a3a3c; }
  .table-item:active { background: #48484a; }
  .sql-wrap {
    flex: 1; display: flex; flex-direction: column;
  }
  textarea {
    width: 100%; flex: 1; min-height: 120px; padding: 12px; font-family: monospace; font-size: 13px;
    background: #2c2c2e; color: #f5f5f5; border: 1px solid #444; border-radius: 8px;
    outline: none; resize: vertical; tab-size: 2;
  }
  textarea:focus { border-color: #0a84ff; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button {
    padding: 8px 20px; font-size: 14px; font-weight: 500; border: none; border-radius: 8px;
    cursor: pointer; background: #0a84ff; color: #fff;
  }
  button:hover { background: #0a6ed9; }
  button:active { background: #085bb5; }
  button:disabled { opacity: 0.5; cursor: default; }
  .shortcut { font-size: 11px; color: #666; }
  .error {
    padding: 12px; background: #3a1a1a; border: 1px solid #5a2a2a; border-radius: 8px;
    color: #ff6b6b; font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 12px;
  }
  .results { margin-top: 12px; overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap;
  }
  th {
    text-align: left; padding: 8px 10px; background: #2c2c2e; border-bottom: 2px solid #444;
    font-weight: 600; position: sticky; top: 0;
  }
  td { padding: 6px 10px; border-bottom: 1px solid #333; max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #2c2c2e; }
  .count { font-size: 12px; color: #888; margin-top: 8px; }
  .affected { color: #30d158; font-size: 13px; margin-top: 8px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #0a84ff; border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .sidebar { width: 100px; font-size: 11px; }
    .table-item { font-size: 11px; padding: 3px 6px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>SQL Editor</h1>
  <a href="/">Back to search</a>
</div>
<div class="editor-row">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">Tables</div>
    <div id="tableList"></div>
  </div>
  <div class="sql-wrap">
    <textarea id="sql" placeholder="Enter SQL statement...&#10;e.g. SELECT * FROM products LIMIT 10"></textarea>
  </div>
</div>
<div class="toolbar">
  <button id="execute">Execute</button>
  <span class="shortcut">Ctrl+Enter</span>
</div>
<div id="output"></div>

<script>
const sqlEl = document.getElementById('sql');
const execBtn = document.getElementById('execute');
const outputEl = document.getElementById('output');
const tableListEl = document.getElementById('tableList');

sqlEl.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    run();
  }
});
execBtn.addEventListener('click', run);

async function loadTables() {
  try {
    const res = await fetch('/api/sql/tables');
    if (res.status === 403) {
      const data = await res.json();
      document.querySelector('.editor-row').style.display = 'none';
      document.querySelector('.toolbar').style.display = 'none';
      outputEl.innerHTML = '<div class="error" style="margin-top:0">' + escapeHtml(data.error || 'Admin API disabled') + '</div>';
      return;
    }
    const data = await res.json();
    if (data.tables) {
      tableListEl.innerHTML = data.tables.map(t =>
        '<div class="table-item" onclick="insertSelect(\'' + escapeHtml(t) + '\')">' + escapeHtml(t) + '</div>'
      ).join('');
    }
  } catch (e) {}
}

function insertSelect(name) {
  sqlEl.value = 'SELECT * FROM ' + name + ' LIMIT 10';
  sqlEl.focus();
}

async function run() {
  const sql = sqlEl.value.trim();
  if (!sql) return;

  execBtn.disabled = true;
  execBtn.innerHTML = '<span class="spinner"></span>';
  outputEl.innerHTML = '';

  try {
    const res = await fetch('/api/sql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql }),
    });
    const data = await res.json();

    if (res.status === 403) {
      outputEl.innerHTML = '<div class="error">' + escapeHtml(data.error || 'Admin API disabled in production') + '</div>';
      return;
    }

    if (data.error) {
      outputEl.innerHTML = '<div class="error">' + escapeHtml(data.error) + '</div>';
    } else if (data.affected) {
      outputEl.innerHTML = '<div class="affected">Statement executed successfully</div>';
    } else if (data.columns) {
      let html = '<div class="count">' + data.row_count + ' row(s)</div>';
      html += '<div class="results"><table><thead><tr>';
      for (const col of data.columns) {
        html += '<th>' + escapeHtml(col) + '</th>';
      }
      html += '</tr></thead><tbody>';
      for (const row of data.rows) {
        html += '<tr>';
        for (const cell of row) {
          html += '<td>' + escapeHtml(cell === null ? 'NULL' : String(cell)) + '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      outputEl.innerHTML = html;
    }
  } catch (e) {
    outputEl.innerHTML = '<div class="error">' + escapeHtml(String(e)) + '</div>';
  } finally {
    execBtn.disabled = false;
    execBtn.textContent = 'Execute';
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadTables();
</script>
</body>
</html>
